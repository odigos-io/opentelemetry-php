name: Tag and Release
run-name: "Tag and Release · ${{ inputs.bump }} on ${{ inputs.base_branch }}"

# Manually triggered release workflow.
# Version bump logic is documented in tag-and-release/calculate.js inside ci-core.
#
# Requires a GitHub Environment named "release-gate" configured with
# required reviewers to serve as the confirmation gate.
#
# Flow:
#   calculate → build (validate) → confirm (release-gate) → tag → publish
#
# The build runs BEFORE the approval gate so that a broken build never
# produces a tag. After approval the publish job reuses the GHA cache
# and only pushes — no rebuild.

concurrency:
  group: tag-and-release
  cancel-in-progress: false

permissions: read-all

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options: [patch, minor, major, pre-minor, pre-major, rc-minor, rc-major]
      base_branch:
        description: "Base branch to tag (e.g. main, releases/v1.3.x)"
        required: true
        default: main
        type: string

env:
  DOCKER_REPOSITORY_NAME: php-community
  DEPOT_REPOSITORY_NAME: 'agents/php-community'
  ECR_REGISTRY: public.ecr.aws/odigos/agents
  DEPOT_REGISTRY: p0xd21zf5r.registry.depot.dev

jobs:
  # ── 1. Calculate the next version ─────────────────────────────────────────
  calculate:
    runs-on: depot-ubuntu-latest
    permissions:
      contents: read
    outputs:
      current_version: ${{ steps.calc.outputs.current_version }}
      new_version: ${{ steps.calc.outputs.new_version }}
      create_branch: ${{ steps.calc.outputs.create_branch }}
      release_branch: ${{ steps.calc.outputs.release_branch }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          fetch-tags: true

      - id: calc
        uses: odigos-io/ci-core/tag-and-release@main
        with:
          operation: calculate
          bump: ${{ inputs.bump }}
          base_branch: ${{ inputs.base_branch }}

      - name: Derive release metadata
        id: meta
        env:
          NEW_VERSION: ${{ steps.calc.outputs.new_version }}
        run: |
          if [[ "${NEW_VERSION}" == *"-pre."* || "${NEW_VERSION}" == *"-rc."* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Build image (no push) to validate before tagging ──────────────────
  build:
    needs: calculate
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build Docker image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: release.Dockerfile
          push: false
          cache-to: type=gha,scope=php-community,mode=max

  # ── 3. Human approval ────────────────────────────────────────────────────
  confirm:
    needs: [calculate, build]
    runs-on: depot-ubuntu-latest
    environment: release-gate
    steps:
      - name: Release approved
        run: echo "Releasing ${{ needs.calculate.outputs.new_version }} from ${{ inputs.base_branch }}"

  # ── 4. Create tag + GitHub release ───────────────────────────────────────
  tag:
    needs: [calculate, confirm]
    runs-on: depot-ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: odigos-io/ci-core/tag-and-release@main
        with:
          operation: tag
          bump: ${{ inputs.bump }}
          base_branch: ${{ inputs.base_branch }}
          sts_identity: tag-releaser
          new_version: ${{ needs.calculate.outputs.new_version }}
          previous_version: ${{ needs.calculate.outputs.current_version }}
          create_branch: ${{ needs.calculate.outputs.create_branch }}
          release_branch: ${{ needs.calculate.outputs.release_branch }}
          actor: ${{ github.actor }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # ── 5. Push image + notify ──────────────────────────────────────────────
  publish:
    needs: [calculate, tag]
    runs-on: depot-ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.calculate.outputs.new_version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr-upload
          aws-region: 'us-east-1'

      - name: Log in to Amazon ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 \
          | docker login --username AWS --password-stdin public.ecr.aws

      - name: Login to Depot Registry
        run: echo "${{ secrets.DEPOT_PUSH_TOKEN }}" | docker login ${DEPOT_REGISTRY} -u x-token --password-stdin

      - name: Compute Docker tags
        id: docker-tags
        env:
          NEW_VERSION: ${{ needs.calculate.outputs.new_version }}
          IS_PRERELEASE: ${{ needs.calculate.outputs.is_prerelease }}
        run: |
          TAGS="${ECR_REGISTRY}/${DOCKER_REPOSITORY_NAME}:${NEW_VERSION},${DEPOT_REGISTRY}/${DEPOT_REPOSITORY_NAME}:${NEW_VERSION}"
          if [[ "${IS_PRERELEASE}" == "false" ]]; then
            TAGS="${TAGS},${ECR_REGISTRY}/${DOCKER_REPOSITORY_NAME}:latest,${DEPOT_REGISTRY}/${DEPOT_REPOSITORY_NAME}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          file: release.Dockerfile
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          cache-from: type=gha,scope=php-community

      - name: Notify Slack
        if: always()
        uses: odigos-io/ci-core/.github/actions/slack-release-notification@main
        with:
          webhook-url: ${{ secrets.ODIGOS_RELEASE_STATUS_WEBHOOK_URL }}
          success-description: "Published a new release of OpenTelemetry PHP Community Agent"
          failure-description: "ERROR: Failed to publish a new release of OpenTelemetry PHP Community Agent"
          tag: ${{ needs.calculate.outputs.new_version }}

  # ── 6. Trigger Odigos version update (OSS, Enterprise, VM Agent) ──────────
  trigger-odigos-update:
    needs: [calculate, publish]
    runs-on: depot-ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Trigger agents version update in consumer repos
        uses: odigos-io/ci-core/dispatch-agent-version-update@main
        with:
          instrumentation_agent: php
          version: ${{ needs.calculate.outputs.new_version }}
          consumers: |
            odigos
            odigos-enterprise
            vm-agent

  # Records the release in Linear with the issues that shipped in it. Its own job, not a
  # step on `tag`: that keeps the third-party CLI away from the STS token, and keeps
  # remote-action resolution — which happens during job setup, before continue-on-error
  # applies — out of the job that cuts the tag.
  linear-release:
    needs: [calculate, tag]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.calculate.outputs.new_version }}
          fetch-depth: 0 # the scan walks commit history
          fetch-tags: true

      - name: Fetch the GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.calculate.outputs.new_version }}
        run: |
          set -uo pipefail
          if ! gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" \
               --json body --jq .body > release-notes.md; then
            echo "::warning::could not read the GitHub release notes for ${VERSION}"
          fi
          # Whitespace-only is worse than nothing: an empty note still occupies the slot
          # in Linear and suppresses its own generation.
          grep -q '[^[:space:]]' release-notes.md 2>/dev/null || rm -f release-notes.md

      - uses: odigos-io/ci-core/linear-release@main
        with:
          access-key: ${{ secrets.LINEAR_RELEASE_ACCESS_KEY }}
          name: ${{ needs.calculate.outputs.new_version }}
          version: ${{ needs.calculate.outputs.new_version }}
          release-notes: release-notes.md
          # Usually a tag on another release branch; the action resolves such a ref
          # to the fork point rather than failing the scan.
          base-ref: ${{ needs.calculate.outputs.current_version }}
          links: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.calculate.outputs.new_version }}
